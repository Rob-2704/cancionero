name: Generar indice.json

on:
  push:
    paths:
      - 'Canciones/**'
  workflow_dispatch:
    inputs:
      refrescar:
        description: 'Volver a buscar todas las fotos de artista (ignora la caché)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  indice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node generar-indice.js
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          REFRESCAR: ${{ inputs.refrescar && '1' || '' }}
      - name: Commit del índice
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add indice.json portadas-artistas-cache.json
          git diff --staged --quiet || (git commit -m "Actualizar indice.json" && git push)
