<!DOCTYPE html>
<html lang="es-mx">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/x-icon" href="img/icono.png">
    <link rel="manifest" href="manifest.json">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sono:MONO@0..1&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" />

    <title>Visor de Letra y Acordes</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1E1E24;
            --text-main: #ffffff;
            --text-sec: #999999;
            --accent: #BC9731;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }
        
        body { 
            padding-bottom: 120px; 
            font-family: 'Sono', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 40px;
            position: relative;
        }
        
        .container { 
            max-width: 90%;
            margin: 0 auto;
        }

        @keyframes fadeInImagen {
            0% { opacity: 0; }
            100% { opacity: 0.18; }
        }

        @keyframes extenderContenedor {
            0% {
                opacity: 0;
                transform: scaleY(0.7);
                transform-origin: top;
            }
            70% {
                opacity: 1;
                transform: scaleY(1.025);
                transform-origin: top;
            }
            100% {
                opacity: 1;
                transform: scaleY(1);
                transform-origin: top;
            }
        }

        @keyframes fadeInTexto {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes desplegarCortina {
            0% {
                opacity: 0;
                max-height: 0;
                margin-bottom: 0;
                padding-top: 0;
                padding-bottom: 0;
                transform: scaleY(0);
                transform-origin: top;
            }
            70% {
                opacity: 1;
                max-height: 100px;
                margin-bottom: 10px;
                padding-top: 12px;
                padding-bottom: 12px;
                transform: scaleY(1.05);
                transform-origin: top;
            }
            100% {
                opacity: 1;
                max-height: 100px;
                margin-bottom: 10px;
                padding-top: 12px;
                padding-bottom: 12px;
                transform: scaleY(1);
                transform-origin: top;
            }
        }

        @keyframes popControlAudio {
            0% { opacity: 0; transform: scale(0.4); }
            75% { opacity: 1; transform: scale(1.15); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes expandirPildoraCentro {
            0% {
                opacity: 0;
                transform: scaleX(0);
                transform-origin: center;
            }
            70% {
                opacity: 1;
                transform: scaleX(1.05);
                transform-origin: center;
            }
            100% {
                opacity: 1;
                transform: scaleX(1);
                transform-origin: center;
            }
        }

        @keyframes expandirSliderAncho {
            0% { opacity: 0; clip-path: inset(0 100% 0 0); }
            100% { opacity: 1; clip-path: inset(0 0 0 0); }
        }

        @keyframes deslizarTexto {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes popBadgeCapo {
            0% { opacity: 0; transform: scale(0.5); }
            70% { opacity: 1; transform: scale(1.12); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes popModalEntrada {
            0% { opacity: 0; transform: scale(0.6) translateY(12px); }
            70% { opacity: 1; transform: scale(1.06) translateY(-2px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes popModalSalida {
            0% { opacity: 1; transform: scale(1) translateY(0); }
            100% { opacity: 0; transform: scale(0.7) translateY(8px); }
        }

        @keyframes deslizarPanelTransponer {
            0% { opacity: 0; transform: translateY(45px); }
            70% { opacity: 1; transform: translateY(-4px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes deslizarPanelTransponerSalida {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(45px); }
        }

        @keyframes deslizarElementoInferior {
            0% { opacity: 0; transform: translateY(45px); }
            70% { opacity: 1; transform: translateY(-4px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes girarSpinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .header-superior {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .btn-volver-admin {
            background-color: transparent;
            color: var(--text-sec);
            border: 2px solid var(--text-sec);
            padding: 8px 14px;
            border-radius: 12px;
            font-family: 'Sono', monospace;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s, transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
            -webkit-tap-highlight-color: transparent;
        }

        .btn-volver-admin:hover {
            background-color: var(--card-bg);
            color: var(--text-main);
            border-color: var(--accent);
        }

        .btn-volver-admin:active { transform: scale(0.95); }


        .info-cabecera {
            grid-column: 1 / 3;
            margin-bottom: 10px;
        }

        .titulo-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }
        
        .info-cabecera h1 {
            margin: 0;
            font-size: 24px;
            opacity: 0;
            will-change: transform, opacity;
            animation: deslizarTexto 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .badge-capo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--card-bg);
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            opacity: 0;
            will-change: transform, opacity;
            animation: popBadgeCapo 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) 0.12s forwards;
        }
        
        .info-cabecera h2 {
            margin: 5px 0 10px 0;
            padding-bottom: 10px;
            font-size: 18px;
            font-weight: 400;
            border-bottom: 2px solid var(--accent);
            opacity: 0;
            will-change: transform, opacity;
            animation: deslizarTexto 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) 0.08s forwards;
        }
        
        .workspace { 
            display: grid;
            gap: 30px;
            margin: 0 auto;
            align-items: start;
        }
        
        .letra-contenedor {
            position: relative;
            background: var(--text-main);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            width: 100%;
            overflow: hidden;
            z-index: 1;

            opacity: 0;
            will-change: transform, opacity;
            animation: extenderContenedor 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards;
        }

        .letra-contenedor::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            height: 85%;
            background-image: url('img/fondo.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0;
            pointer-events: none;
            z-index: 0;
            will-change: opacity;

            -webkit-mask-image: radial-gradient(circle, rgba(0, 0, 0, 1) 50%, rgba(0, 0, 0, 0) 90%);
            mask-image: radial-gradient(circle, rgba(0, 0, 0, 1) 50%, rgba(0, 0, 0, 0) 90%);
        }

        .letra-contenedor.fondo-activo::before {
            animation: fadeInImagen 0.5s ease-out forwards;
        }
        
        .letra-texto { 
            position: relative;
            z-index: 1;
            display: block;
            font-family: 'Sono', monospace;
            font-variation-settings: 'MONO' 1;
            font-size: clamp(10px, 1.3vw, 16px);
            color: var(--bg-color);
            margin: 0;
            white-space: pre;
            overflow-x: auto;
            width: 100%;
            opacity: 1;
            will-change: transform, opacity;
        }

        .letra-texto.animar-entrada-texto {
            animation: fadeInTexto 0.32s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        
        .acorde-link { 
            color: #0066cc;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            border-radius: 3px;
            -webkit-tap-highlight-color: transparent;
        }

        /* Área táctil ampliada: no cambia el diseño, solo agranda la zona clicable */
        .acorde-link { position: relative; }
        .acorde-link::after {
            content: "";
            position: absolute;
            top: -10px;
            bottom: -10px;
            left: -7px;
            right: -7px;
        }
        /* Evita que el área ampliada de los acordes de los bordes genere scroll vertical */
        .letra-texto { overflow-y: hidden; }
                
        .barra-compas { 
            color: var(--bg-color);
            font-weight: bold; 
        }
        
        .caja-acorde-emergente { 
            position: fixed; 
            display: none; 
            background: var(--card-bg);
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); 
            padding: 12px; 
            z-index: 1000; 
            width: fit-content;
            max-width: 90vw;
            text-align: center;
            will-change: transform, opacity;
        }

        .caja-acorde-emergente.animar-entrada {
            animation: popModalEntrada 0.22s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .caja-acorde-emergente.animar-salida {
            animation: popModalSalida 0.18s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        
        .caja-acorde-emergente h4 { 
            margin: 0 0 6px 0; 
            font-size: 16px; 
            font-family: 'Sono', sans-serif;
            font-variation-settings: 'MONO' 0;
        }
        
        #wrapper-render {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin: 5px 0 0 0;
        }

        .btn-reproducir-acorde {
            margin: 8px auto 0 auto;
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            border-radius: 50px;
            width: 100%;
            min-width: 130px;
            height: 36px;
            padding: 0 16px;
            gap: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-family: 'Sono', sans-serif;
            font-variation-settings: 'MONO' 0;
            font-size: 13px;
            font-weight: 700;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .btn-reproducir-acorde .material-symbols-outlined {
            font-size: 20px;
        }

        .btn-reproducir-acorde:active { transform: scale(1.12); }
        
        #panel-flotante-wrapper {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 999;
        }
        
        .fila-inferior {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 360px;
            max-width: 90vw;
        }

        #panel-scroll {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 18px;
            opacity: 0;
            will-change: transform, opacity;
            animation: deslizarElementoInferior 0.28s cubic-bezier(0.34, 1.56, 0.64, 1) 0.22s forwards;
        }

        .icono-velocidad-scroll {
            color: var(--text-sec);
            opacity: 0.75;
            font-size: 20px;
            user-select: none;
            flex-shrink: 0;
        }
        
        .panel-scroll-flotante {
            background: var(--card-bg);
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        #panel-transponer {
            width: 360px;
            max-width: 90vw;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 10px 16px;
        }

        .grupo-extra-transponer {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .grupo-pasos {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 50px;
            padding: 3px;
            flex-shrink: 0;
            opacity: 0;
            will-change: transform, opacity;
        }

        .divisor-panel {
            width: 1px;
            height: 28px;
            background: rgba(255, 255, 255, 0.14);
            border-radius: 1px;
            flex-shrink: 0;
        }

        @media (max-width: 380px) {
            #panel-transponer, .fila-inferior { width: 90vw; }
            #panel-transponer { gap: 6px; padding: 10px 12px; }
        }

        #panel-transponer.panel-transponer-entrada {
            will-change: transform, opacity;
            animation: deslizarPanelTransponer 0.28s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        #panel-transponer.panel-transponer-salida {
            will-change: transform, opacity;
            animation: deslizarPanelTransponerSalida 0.2s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
        }

        #panel-transponer.panel-transponer-entrada .grupo-pasos {
            animation: expandirPildoraCentro 0.32s cubic-bezier(0.34, 1.56, 0.64, 1) 0.05s forwards;
        }

        #panel-transponer.panel-transponer-entrada #btn-reset-tono,
        #panel-transponer.panel-transponer-entrada #btn-alteracion,
        #panel-transponer.panel-transponer-entrada #btn-toggle-cifrado {
            animation: popControlAudio 0.22s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        #panel-transponer.panel-transponer-entrada #btn-reset-tono       { animation-delay: 0.12s; }
        #panel-transponer.panel-transponer-entrada #btn-alteracion      { animation-delay: 0.18s; }
        #panel-transponer.panel-transponer-entrada #btn-toggle-cifrado  { animation-delay: 0.24s; }

        .grupo-pasos.animacion-completada {
            opacity: 1;
            transform: scaleX(1);
            animation: none;
        }

        #btn-reset-tono.animacion-completada,
        #btn-alteracion.animacion-completada,
        #btn-toggle-cifrado.animacion-completada {
            opacity: 1;
            transform: scale(1);
            animation: none;
        }
        
        .btn-scroll,
        .btn-transponer,
        .btn-toggle-transponer {
            font-family: 'Sono', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            flex-shrink: 0;
        }
        
        .btn-scroll { 
            background: var(--accent);
            border: none;
            color: var(--bg-color);
            width: 36px;
            height: 36px;
            user-select: none;
            font-family: 'Material Symbols Outlined' !important;
            font-weight: normal !important;
            font-style: normal !important;
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24 !important;
            -webkit-font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24 !important;
        }

        .btn-transponer {
            background: var(--text-main);
            color: var(--bg-color);
            border: none;
            width: 36px; 
            height: 36px; 
            font-size: 14px; 
        }

        #btn-reset-tono {
            background: var(--accent);
            opacity: 0;
            will-change: transform, opacity;
        }

        .btn-dual {
            --dual-size: 44px;
            --dual-color-activo: var(--bg-color);
            --dual-color-inactivo: #9d9d9d;
            --dual-cx-activo: 38%;
            --dual-cy-activo: 40%;
            --dual-cx-inactivo: 68%;
            --dual-cy-inactivo: 68%;

            position: relative;
            width: var(--dual-size);
            height: var(--dual-size);
            padding: 0;
            border: none;
            overflow: hidden;
            font-size: 0;
            color: transparent;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.1), 0 2px 6px rgba(0, 0, 0, 0.35);
            opacity: 0;
            will-change: transform, opacity;
        }

        @media (max-width: 420px) {
            .btn-dual { --dual-size: 40px; }
        }

        .btn-dual::before,
        .btn-dual::after {
            content: "";
            position: absolute;
            pointer-events: none;
            line-height: 1;
            font-weight: 700;
            font-family: 'Sono', system-ui, sans-serif;
            font-variation-settings: 'MONO' 0;
            transition: color 0.2s ease, background-color 0.2s ease;
        }

        .btn-dual::before {
            left: var(--dual-cx-activo);
            top: var(--dual-cy-activo);
            transform: translate(-50%, -50%);
            color: var(--dual-color-activo);
        }

        .btn-dual::after {
            left: var(--dual-cx-inactivo);
            top: var(--dual-cy-inactivo);
            transform: translate(-50%, -50%);
            color: var(--dual-color-inactivo);
        }

        .btn-dual::before { content: attr(data-a); font-size: var(--dual-fs-activo); }
        .btn-dual::after  { content: attr(data-b); font-size: var(--dual-fs-inactivo); }

        .btn-dual[data-activo="b"]::before { content: attr(data-b); }
        .btn-dual[data-activo="b"]::after  { content: attr(data-a); }

        .btn-dual--musical {
            --dual-fs-activo: calc(var(--dual-size) * 0.52);
            --dual-fs-inactivo: calc(var(--dual-size) * 0.30);
            --dual-cx-activo: 36%;
            --dual-cy-activo: 38%;
            --dual-cx-inactivo: 66%;
            --dual-cy-inactivo: 68%;
        }

        .btn-dual--musical::before,
        .btn-dual--musical::after {
            font-family: system-ui, 'Segoe UI Symbol', 'Sono', sans-serif;
        }

        .btn-dual--texto {
            --dual-fs-activo: calc(var(--dual-size) * 0.32);
            --dual-fs-inactivo: calc(var(--dual-size) * 0.22);
            --dual-borde: 18%;
            --dual-cy-activo: 40%;
            --dual-cy-inactivo: 68%;
        }

        .btn-dual--texto::before {
            left: var(--dual-borde);
            top: var(--dual-cy-activo);
            transform: translate(0, -50%);
        }

        .btn-dual--texto::after {
            left: auto;
            right: var(--dual-borde);
            top: var(--dual-cy-inactivo);
            transform: translate(0, -50%);
        }

        .btn-toggle-transponer {
            background: var(--card-bg);
            border: 2px solid var(--card-bg);
            color: var(--text-main);
            height: 62px;
            width: 62px;
            padding: 0;
            border-radius: 50px;
            font-size: 13px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            opacity: 0;
            will-change: transform, opacity;
            animation: deslizarElementoInferior 0.28s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
            flex-direction: column;
            gap: 1px;
            line-height: 1;
        }

        .btn-toggle-transponer.animacion-completada {
            opacity: 1;
            transform: translateY(0);
            animation: none;
        }

        #btn-toggle-transponer::before {
            content: 'arrow_drop_down_circle';
            transform: rotate(180deg);
            font-family: 'Material Symbols Outlined' !important;
            font-size: 18px;
            font-weight: normal;
            font-style: normal;
            color: var(--accent);
            line-height: 1;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.2s ease;
        }

        #btn-toggle-transponer.abierto::before {
            content: 'arrow_drop_down_circle';
            transform: rotate(0deg);
        }

        #btn-toggle-transponer.abierto {
            color: var(--accent);
            border-color: var(--accent);
        }
        
        .slider-scroll { 
            flex: 1;
            min-width: 0;
            width: 100%;
            accent-color: var(--accent); 
        }

        .btn-scroll,
        .btn-transponer,
        .btn-toggle-transponer {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }
        
        .btn-scroll:active,
        .btn-transponer:active,
        .btn-toggle-transponer:active {
            transform: scale(1.12) !important;
        }

        @media (hover: hover) {
            .btn-scroll:hover,
            .btn-transponer:hover,
            .btn-toggle-transponer:hover {
                transform: scale(1.1) !important;
            }
        }

        @media (max-width: 600px) {
            .caja-acorde-emergente {
                padding: 8px 12px;
                border-radius: 20px;
            }

            .caja-acorde-emergente h4 {
                font-size: 14px;
                margin-bottom: 2px;
            }

            .titulo-row {
                flex-wrap: wrap;
                gap: 8px;
            }

            .badge-capo {
                font-size: 12px;
                padding: 4px 10px;
            }

        }
        
        @media (max-width: 1300px) {
            body { 
                padding: 40px 5px 100px 5px;
            }
        
            .workspace { 
                display: flex;
                flex-direction: column-reverse; 
                gap: 20px;
            }
        
            .letra-contenedor {
                padding: 30px;
            }
        
            .letra-texto {
                line-height: 1.5;
                letter-spacing: -0.3px;
            }
        }

        .btn-paso {
            position: relative;
            background: transparent;
            color: var(--text-main);
            width: 40px;
            height: 36px;
            border-radius: 50px;
            font-size: 14px;
        }

        .btn-paso + .btn-paso::before {
            content: "";
            position: absolute;
            left: 0;
            top: 26%;
            bottom: 26%;
            width: 1px;
            background: rgba(255, 255, 255, 0.14);
        }

        .btn-paso:active {
            transform: none !important;
            background: rgba(255, 255, 255, 0.18);
        }

        @media (hover: hover) {
            .btn-paso:hover {
                transform: none !important;
                background: rgba(255, 255, 255, 0.12);
            }
        }

        @media (max-width: 420px) {
            .btn-paso { width: 36px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-superior">
            <a id="link-regreso" href="index.html" class="btn-volver-admin">← Volver a Artistas</a>
        </div>

        <div class="info-cabecera">
            <div class="titulo-row">
                <h1 id="titulo-cancion">Cargando...</h1>
                <div id="badge-capo" class="badge-capo" style="display: none;">
                    <span id="texto-capo"></span>
                </div>
            </div>
            <h2 id="nombre-artista"></h2>
        </div>


        <div class="workspace">
            <article id="letra-contenedor" class="letra-contenedor">
                <pre id="letra-cancion" class="letra-texto">Abriendo canción...</pre>
            </article>
        </div>
    </div>

    <div id="caja-acorde" class="caja-acorde-emergente">
       <h4 id="acorde-titulo"></h4>
       <span id="origen-acorde-modal" style="font-size:10px; opacity:0.6; display:block; margin-bottom:4px;"></span>
       <div id="wrapper-render"></div> 
       <button id="btn-reproducir-acorde" class="btn-reproducir-acorde" title="Reproducir acorde">
           <span class="material-symbols-outlined">play_arrow</span>
           <span class="texto-reproducir">Reproducir</span>
       </button>
    </div>
    
    <div id="panel-flotante-wrapper">
        <div id="panel-transponer" class="panel-scroll-flotante" style="display:none;">
            <div class="grupo-pasos">
                <button id="btn-bajar-tono" class="btn-transponer btn-paso" title="Bajar 1 tono">−1</button>
                <button id="btn-bajar-medio" class="btn-transponer btn-paso" title="Bajar medio tono">−½</button>
                <button id="btn-subir-medio" class="btn-transponer btn-paso" title="Subir medio tono">+½</button>
                <button id="btn-subir-tono" class="btn-transponer btn-paso" title="Subir 1 tono">+1</button>
            </div>

            <button id="btn-reset-tono" class="btn-scroll material-symbols-outlined" title="Volver a la tonalidad original">refresh</button>

            <span class="divisor-panel" aria-hidden="true"></span>

            <div class="grupo-extra-transponer">
                <button id="btn-alteracion" class="btn-transponer btn-dual btn-dual--musical" data-a="♭" data-b="♯" data-activo="b" title="Cambiar entre sostenidos y bemoles">♭</button>
                <button id="btn-toggle-cifrado" class="btn-transponer btn-dual btn-dual--texto" data-a="DO" data-b="C" data-activo="a" title="Cambiar cifrado (Español / Inglés)"></button>
            </div>
        </div>

        <div class="fila-inferior">
            <div id="panel-scroll" class="panel-scroll-flotante">
                <button id="btn-play-scroll" class="btn-scroll material-symbols-outlined" title="Iniciar/Detener autoscroll">keyboard_double_arrow_down</button>
                <span class="material-symbols-outlined icono-velocidad-scroll" title="Velocidad de desplazamiento">speed</span>
                <input type="range" id="slider-velocidad" class="slider-scroll" min="1" max="30" value="10">
            </div>
            <button id="btn-toggle-transponer" class="btn-toggle-transponer" title="Transponer tonalidad">—</button>
        </div>
    </div>

    <script src="js/acordes.js"></script>

    <script type="module">
        import { obtenerContenidoCancion } from './js/api-cliente.js';
        import { procesarLetraYAcordes, inicializarModalAcordes } from './js/modulo-acordes.js';
        import { inicializarReproductorAcorde } from './js/modulo-audio-acorde.js';
        import { inicializarAutoscroll } from './js/modulo-autoscroll.js';
        import { inicializarTransponer } from './js/modulo-transponer.js';

        let wakeLock = null;

        async function solicitarWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => {
                        wakeLock = null;
                    });
                }
            } catch (err) {
                console.error(`Error al activar Wake Lock: ${err.name}, ${err.message}`);
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await solicitarWakeLock();
            }
        });

        solicitarWakeLock();

        const params = new URLSearchParams(window.location.search);
        const idC = params.get('idC');

        const letraCancionDiv = document.getElementById('letra-cancion');
        const letraContenedorEl = document.getElementById('letra-contenedor');
        const btnToggleCifrado = document.getElementById('btn-toggle-cifrado');
        const btnToggleTransponer = document.getElementById('btn-toggle-transponer');
        const btnResetTono = document.getElementById('btn-reset-tono');
        const btnAlteracion = document.getElementById('btn-alteracion');
        const grupoPasos = document.querySelector('.grupo-pasos');

        if (btnToggleTransponer) {
            btnToggleTransponer.addEventListener('animationend', (e) => {
                if (e.animationName === 'deslizarElementoInferior') {
                    btnToggleTransponer.classList.add('animacion-completada');
                }
            });
        }

        if (grupoPasos) {
            grupoPasos.addEventListener('animationend', (e) => {
                if (e.animationName === 'expandirPildoraCentro') {
                    grupoPasos.classList.add('animacion-completada');
                }
            });
        }

        [btnResetTono, btnAlteracion, btnToggleCifrado].forEach(btn => {
            if (btn) {
                btn.addEventListener('animationend', (e) => {
                    if (e.animationName === 'popControlAudio') {
                        btn.classList.add('animacion-completada');
                    }
                });
            }
        });

        let sistemaCifrado = localStorage.getItem('sistemaCifrado') || 'LATINO';
        let contenidoActualTranspuesto = '';
        let controladorTransponer = null;

        function actualizarBotonCifrado() {
            if (btnToggleCifrado) {
                btnToggleCifrado.dataset.activo = sistemaCifrado === 'LATINO' ? 'a' : 'b';
            }
        }

        const ALTERACION_MUESTRA_ACTUAL = false;
        function sincronizarAlteracion() {
            if (!btnAlteracion) return;
            const t = btnAlteracion.textContent.trim();
            if (!t) return;
            const esBemol = (t === '♭' || t === 'b');
            const bemolActivo = ALTERACION_MUESTRA_ACTUAL ? esBemol : !esBemol;
            btnAlteracion.dataset.activo = bemolActivo ? 'a' : 'b';
        }
        sincronizarAlteracion();
        if (btnAlteracion) {
            new MutationObserver(sincronizarAlteracion)
                .observe(btnAlteracion, { childList: true, characterData: true, subtree: true });
        }



        async function cargarPlantilla() {
            if(!idC) {
                letraCancionDiv.textContent = "Error: No se definió el identificador de la canción.";
                return;
            }

            try {
                const data = await obtenerContenidoCancion(idC);
                if (data.error) { letraCancionDiv.textContent = "Error: " + data.error; return; }

                document.getElementById('titulo-cancion').textContent = data.nombreC;
                document.title = `${data.nombreC} - ${data.nombreA}`;

                // Subtítulo: artista principal · álbum
                const sencillo = !data.albumC || data.albumC.toLowerCase() === 'sencillo';
                document.getElementById('nombre-artista').textContent =
                    sencillo ? data.nombreA : `${data.nombreA} · ${data.albumC}`;

                // El botón de regreso lleva a la lista de canciones de este artista
                const linkRegreso = document.getElementById('link-regreso');
                if (linkRegreso) {
                    linkRegreso.href = `canciones.html?idA=${encodeURIComponent(data.idA)}&nombre=${encodeURIComponent(data.nombreA)}`;
                }


                let contenidoProcesar = data.contenido || "";
                const matchCapo = contenidoProcesar.match(/Capo:\s*#?\s*(\d+)/i);
                const badgeCapo = document.getElementById('badge-capo');
                const textoCapo = document.getElementById('texto-capo');

                if (matchCapo) {
                    const numeroCapo = matchCapo[1];
                    if (badgeCapo && textoCapo) {
                        textoCapo.textContent = `Capo: ${numeroCapo}º traste`;
                        badgeCapo.style.display = 'inline-flex';
                    }

                    const lineas = contenidoProcesar.split(/\r?\n/);
                    if (lineas.length > 0 && /Capo:/i.test(lineas[0])) {
                        lineas.splice(0, Math.min(2, lineas.length));
                        contenidoProcesar = lineas.join('\n');
                    } else {
                        contenidoProcesar = contenidoProcesar.replace(/^.*Capo:\s*#?\s*\d+.*(?:\r?\n)?/im, '');
                    }
                } else {
                    if (badgeCapo) badgeCapo.style.display = 'none';
                }

                contenidoActualTranspuesto = contenidoProcesar;
                actualizarBotonCifrado();
                letraCancionDiv.innerHTML = procesarLetraYAcordes(contenidoProcesar, sistemaCifrado);
                
                letraCancionDiv.classList.remove('animar-entrada-texto');
                void letraCancionDiv.offsetWidth;
                letraCancionDiv.classList.add('animar-entrada-texto');

                if (letraContenedorEl) {
                    const activarFondo = () => letraContenedorEl.classList.add('fondo-activo');
                    letraContenedorEl.addEventListener('animationend', (e) => {
                        if (e.animationName === 'extenderContenedor') {
                            activarFondo();
                        }
                    }, { once: true });

                    setTimeout(activarFondo, 450);
                }

                inicializarModalAcordes('caja-acorde', () => sistemaCifrado);
                inicializarReproductorAcorde('btn-reproducir-acorde', 'wrapper-render');

                const cajaAcordeEl = document.getElementById('caja-acorde');
                if (cajaAcordeEl) {
                    let enProcesoDeCierre = false;
                    let ultimoDisplayVal = 'none';

                    document.addEventListener('click', (e) => {
                        const linkAcorde = e.target.closest('.acorde-link');
                        if (linkAcorde) {
                            enProcesoDeCierre = false;
                            cajaAcordeEl.classList.remove('animar-salida');

                            cajaAcordeEl.classList.remove('animar-entrada');
                            void cajaAcordeEl.offsetWidth;
                            cajaAcordeEl.classList.add('animar-entrada');
                        }
                    }, true);

                    const observadorCaja = new MutationObserver(() => {
                        const displayActual = cajaAcordeEl.style.display;

                        if (displayActual === 'none' && !enProcesoDeCierre && ultimoDisplayVal !== 'none') {
                            enProcesoDeCierre = true;
                            cajaAcordeEl.style.display = ultimoDisplayVal;
                            cajaAcordeEl.classList.remove('animar-entrada');
                            cajaAcordeEl.classList.add('animar-salida');

                            setTimeout(() => {
                                cajaAcordeEl.classList.remove('animar-salida');
                                cajaAcordeEl.style.display = 'none';
                                ultimoDisplayVal = 'none';
                                enProcesoDeCierre = false;
                            }, 180);
                        } else if (displayActual !== 'none' && !enProcesoDeCierre) {
                            ultimoDisplayVal = displayActual;
                        }
                    });

                    observadorCaja.observe(cajaAcordeEl, { attributes: true, attributeFilter: ['style'] });
                }

                const panelTranspon = document.getElementById('panel-transponer');
                if (panelTranspon) {
                    let enProcesoCierrePanel = false;
                    let ultimoDisplayPanel = 'none';

                    const observadorPanel = new MutationObserver(() => {
                        const displayActual = panelTranspon.style.display;

                        if (displayActual === 'none' && !enProcesoCierrePanel && ultimoDisplayPanel !== 'none') {
                            enProcesoCierrePanel = true;
                            panelTranspon.style.display = ultimoDisplayPanel;
                            panelTranspon.classList.remove('panel-transponer-entrada');
                            panelTranspon.classList.add('panel-transponer-salida');
                            if (btnToggleTransponer) btnToggleTransponer.classList.remove('abierto');

                            if (grupoPasos) grupoPasos.classList.remove('animacion-completada');
                            if (btnResetTono) btnResetTono.classList.remove('animacion-completada');
                            if (btnAlteracion) btnAlteracion.classList.remove('animacion-completada');
                            if (btnToggleCifrado) btnToggleCifrado.classList.remove('animacion-completada');

                            setTimeout(() => {
                                panelTranspon.classList.remove('panel-transponer-salida');
                                panelTranspon.style.display = 'none';
                                ultimoDisplayPanel = 'none';
                                enProcesoCierrePanel = false;
                            }, 200);
                        } else if (displayActual !== 'none' && !enProcesoCierrePanel) {
                            ultimoDisplayPanel = displayActual;
                            panelTranspon.classList.remove('panel-transponer-salida');
                            if (btnToggleTransponer) btnToggleTransponer.classList.add('abierto');

                            if (grupoPasos) grupoPasos.classList.remove('animacion-completada');
                            if (btnResetTono) btnResetTono.classList.remove('animacion-completada');
                            if (btnAlteracion) btnAlteracion.classList.remove('animacion-completada');
                            if (btnToggleCifrado) btnToggleCifrado.classList.remove('animacion-completada');

                            panelTranspon.classList.remove('panel-transponer-entrada');
                            void panelTranspon.offsetWidth;
                            panelTranspon.classList.add('panel-transponer-entrada');
                        }
                    });

                    observadorPanel.observe(panelTranspon, { attributes: true, attributeFilter: ['style'] });
                }

                inicializarAutoscroll('btn-play-scroll', 'slider-velocidad');
                
                const btnScrollEl = document.getElementById('btn-play-scroll');
                if (btnScrollEl) {
                    const sincronizarIconoScroll = () => {
                        const txt = btnScrollEl.textContent.trim();
                        if (txt === '▶' || txt === 'play' || txt === 'PLAY' || txt === 'play_arrow') {
                            if (btnScrollEl.textContent !== 'keyboard_double_arrow_down') {
                                btnScrollEl.textContent = 'keyboard_double_arrow_down';
                            }
                        } else if (txt === '⏸' || txt === 'pause' || txt === 'PAUSE' || txt === 'PAUSA') {
                            if (btnScrollEl.textContent !== 'stop') {
                                btnScrollEl.textContent = 'stop';
                            }
                        }
                    };
                    sincronizarIconoScroll();
                    const observerScroll = new MutationObserver(sincronizarIconoScroll);
                    observerScroll.observe(btnScrollEl, { childList: true, characterData: true, subtree: true });
                }

                controladorTransponer = inicializarTransponer({
                    contenidoOriginal: contenidoProcesar,
                    onRetransponer: (texto) => {
                        contenidoActualTranspuesto = texto;
                        letraCancionDiv.innerHTML = procesarLetraYAcordes(texto, sistemaCifrado);
                    },
                    tonalidadLabelId: 'btn-toggle-transponer',
                    btnSubirTonoId: 'btn-subir-tono',
                    btnSubirMedioId: 'btn-subir-medio',
                    btnBajarMedioId: 'btn-bajar-medio',
                    btnBajarTonoId: 'btn-bajar-tono',
                    btnResetId: 'btn-reset-tono',
                    btnAlteracionId: 'btn-alteracion',
                    btnToggleId: 'btn-toggle-transponer',
                    panelId: 'panel-transponer',
                    obtenerSistema: () => sistemaCifrado
                });

                if (btnToggleCifrado) {
                    btnToggleCifrado.addEventListener('click', () => {
                        sistemaCifrado = sistemaCifrado === 'ANGLOSAJON' ? 'LATINO' : 'ANGLOSAJON';
                        localStorage.setItem('sistemaCifrado', sistemaCifrado);
                        actualizarBotonCifrado();
                        if (contenidoActualTranspuesto) {
                            letraCancionDiv.innerHTML = procesarLetraYAcordes(contenidoActualTranspuesto, sistemaCifrado);
                        }
                        if (controladorTransponer) {
                            controladorTransponer.actualizar();
                        }
                    });
                }

            } catch (err) {
                console.error(err);
                letraCancionDiv.textContent = "Error crítico al descargar el contenido de la canción.";
            }
        }

        cargarPlantilla();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registrado con éxito:', reg.scope))
                    .catch(err => console.log('Error al registrar el Service Worker:', err));
            });
        }
    </script>
</body>
</html>
