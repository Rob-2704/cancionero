<!DOCTYPE html>
<html lang="es-mx">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d0d0d">

    <link rel="icon" type="image/x-icon" href="img/icono.png">
    <link rel="manifest" href="manifest.json">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sono:MONO@0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&display=swap">

    <link href="style.css" rel="stylesheet">
    <title>Canciones</title>
</head>
<body>
    <header>
        <div class="header-superior">
            <a href="index.html" class="btn-volver">
                <span class="material-symbols-outlined" style="font-size:16px;">arrow_back</span> Artistas
            </a>
            <span id="indicador-guardado" class="indicador-guardado" title="Sincronizando canciones...">
                <span class="material-symbols-outlined icono-estado-guardado">sync</span>
            </span>
        </div>
        <h1 id="artista-titulo">Artista</h1>
        <p>Selecciona una canción.</p>
    </header>

    <main>
        <div id="explorador" class="explorador-grid">
            <div class="cargando">Cargando canciones...</div>
        </div>
    </main>

    <script type="module">
        import {
            obtenerCancionesDeArtista, obtenerPortadaAlbumCancion,
            alCambiarEstadoGuardado, alActualizarDatos,
            ETIQUETA_ESTADO, CONFIGURADO
        } from './js/api-cliente.js';
        import {
            activarAnimacionIconos, conectarIndicador,
            animarEntrada, contarColumnas, aplicarPortada
        } from './js/ui.js';

        const params = new URLSearchParams(window.location.search);
        const idA = params.get('idA');

        const artistaTitulo = document.getElementById('artista-titulo');
        const exploradorDiv = document.getElementById('explorador');
        let firma = '';

        // El título aparece al instante con el nombre que viene en el enlace; luego se confirma con los datos
        artistaTitulo.textContent = params.get('nombre') || 'Artista';
        document.title = artistaTitulo.textContent;

        conectarIndicador(alCambiarEstadoGuardado);
        activarAnimacionIconos();

        function mostrarMensaje(texto, error = false) {
            exploradorDiv.innerHTML = '';
            const div = document.createElement('div');
            div.className = 'cargando' + (error ? ' error' : '');
            div.textContent = texto;
            exploradorDiv.appendChild(div);
        }

        async function render(animar) {
            if (!idA) { mostrarMensaje('Error: no se especificó una carpeta válida.', true); return; }
            if (!CONFIGURADO) {
                mostrarMensaje('Falta configurar Firebase: edita js/firebase-config.js con los datos de tu proyecto.', true);
                return;
            }

            try {
                const canciones = await obtenerCancionesDeArtista(idA);
                const nuevaFirma = JSON.stringify(canciones);
                if (!animar && nuevaFirma === firma) return;
                firma = nuevaFirma;

                if (canciones.length === 0) {
                    mostrarMensaje('Esta carpeta no tiene canciones registradas aún.');
                    return;
                }

                artistaTitulo.textContent = canciones[0].nombreA;
                document.title = canciones[0].nombreA;

                exploradorDiv.innerHTML = '';
                const columnas = contarColumnas(exploradorDiv);

                canciones.forEach((cancion, indice) => {
                    const tarjeta = document.createElement('a');
                    tarjeta.className = 'tarjeta';
                    tarjeta.href = `visor.html?idC=${encodeURIComponent(cancion.idC)}`;

                    const detalles = [cancion.albumC, ETIQUETA_ESTADO[cancion.estado]].filter(Boolean);
                    tarjeta.title = `${cancion.nombreC} · ${detalles.join(' · ')}`;

                    const portada = document.createElement('div');
                    portada.className = 'tarjeta-portada';

                    const nombre = document.createElement('div');
                    nombre.className = 'icono-flotante';
                    nombre.textContent = cancion.nombreC;

                    const estado = document.createElement('div');
                    estado.className = `indicador-estado ${cancion.estado}`;

                    tarjeta.append(portada, nombre, estado);

                    if (animar) animarEntrada(tarjeta, indice, columnas);
                    else tarjeta.classList.add('sin-animacion');

                    exploradorDiv.appendChild(tarjeta);

                    // Carátula del álbum; si hay artista secundario, la busca con ese artista
                    obtenerPortadaAlbumCancion(cancion.artistaCaratula, cancion.albumC, cancion.albumBusqueda)
                        .then(url => aplicarPortada(tarjeta, url));
                });
            } catch (err) {
                console.error(err);
                if (err && err.message === 'FIREBASE_NO_CONFIGURADO') {
                    mostrarMensaje('Falta configurar Firebase: edita js/firebase-config.js con los datos de tu proyecto.', true);
                } else {
                    mostrarMensaje('Error al cargar las canciones.', true);
                }
            }
        }

        render(true);
        alActualizarDatos(() => render(false));
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('Service Worker no registrado:', err));
            });
        }
    </script>
</body>
</html>
