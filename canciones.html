<!DOCTYPE html>
<html lang="es-mx">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d0d0d">

    <link rel="icon" type="image/x-icon" href="img/icono.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sono:MONO@0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&display=swap">

    <link href="style.css" rel="stylesheet">
    <title>Canciones</title>
</head>
<body>
    <header>
        <div class="header-superior">
            <a href="index.html" class="btn">
                <span class="material-symbols-outlined">arrow_back</span> Artistas
            </a>
            <span id="indicador-guardado" class="indicador-guardado" title="Sincronizando canciones...">
                <span class="material-symbols-outlined icono-estado-guardado">sync</span>
            </span>
        </div>
        <h1 id="artista-titulo">Artista</h1>
        <p>Selecciona una canción.</p>
    </header>

    <main>
        <div id="explorador" class="explorador-grid">
            <div class="cargando">Cargando canciones...</div>
        </div>
    </main>

    <script type="module">
        import { obtenerCancionesDeArtista, alActualizarDatos, ETIQUETA_ESTADO, CONFIGURADO } from './js/datos.js';
        import { obtenerPortadaCancion } from './js/portadas.js';
        import {
            activarIconos, conectarIndicador, contarColumnas, animarEntrada,
            crearTarjeta, portadaAlVer, mostrarMensaje
        } from './js/ui.js';

        const idA = new URLSearchParams(window.location.search).get('idA');
        const artistaTitulo = document.getElementById('artista-titulo');
        const exploradorDiv = document.getElementById('explorador');
        let firma = '';

        conectarIndicador();
        activarIconos();

        async function render(animar) {
            if (!idA) { mostrarMensaje(exploradorDiv, 'Error: no se especificó un artista válido.', true); return; }
            if (!CONFIGURADO) {
                mostrarMensaje(exploradorDiv, 'Falta configurar la base de datos: edita js/config.js.', true);
                return;
            }

            try {
                const canciones = await obtenerCancionesDeArtista(idA);
                const nuevaFirma = JSON.stringify(canciones);
                if (!animar && nuevaFirma === firma) return;
                firma = nuevaFirma;

                if (canciones.length === 0) {
                    mostrarMensaje(exploradorDiv, 'Este artista no tiene canciones registradas.');
                    return;
                }

                artistaTitulo.textContent = canciones[0].nombreA;
                document.title = canciones[0].nombreA;

                exploradorDiv.innerHTML = '';
                const columnas = contarColumnas(exploradorDiv);

                canciones.forEach((cancion, indice) => {
                    const detalles = [cancion.albumC, ETIQUETA_ESTADO[cancion.estado]].filter(Boolean);
                    const tarjeta = crearTarjeta({
                        href: `visor.html?idC=${encodeURIComponent(cancion.idC)}`,
                        titulo: `${cancion.nombreC} · ${detalles.join(' · ')}`,
                        nombre: cancion.nombreC,
                        estado: cancion.estado
                    });
                    if (animar) animarEntrada(tarjeta, indice, columnas);
                    else tarjeta.classList.add('sin-animacion');
                    exploradorDiv.appendChild(tarjeta);

                    // Carátula del álbum; si hay artista secundario, se busca con ese artista
                    portadaAlVer(tarjeta, () => obtenerPortadaCancion(cancion));
                });
            } catch (err) {
                console.error(err);
                mostrarMensaje(exploradorDiv, 'Error al cargar las canciones.', true);
            }
        }

        render(true);
        alActualizarDatos(() => render(false));
    </script>
</body>
</html>
