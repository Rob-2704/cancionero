<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="icono.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sono:MONO@0..1&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <title>Canciones</title>
    <style>
        header {
            max-width: 1200px;
            margin: 0 auto 30px auto;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            color: #fff;
        }

        p {
            margin: 5px 0 0 0;
            font-size: 13px;
            color: #888;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .btn-volver {
            display: inline-block;
            color: #888;
            text-decoration: none;
            font-size: 13px;
            margin-bottom: 25px;
            transition: color 0.2s;
        }

        .btn-volver:hover {
            color: var(--accent);
        }

        .explorador-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin: 0 auto;
        }

        .tarjeta {
            background-color: #1e1e24;
            border-radius: 12px;
            aspect-ratio: 1 / 1;
            position: relative;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .tarjeta:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .icono-flotante {
            position: absolute;
            bottom: 12px;
            left: 12px;
            font-size: 16px;
            z-index: 2;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 4px 10px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            font-weight: bold;
            margin-right: 12px;
        }

        .indicador-estado {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 20px;
            z-index: 2;
            line-height: 1;
        }

        .cargando {
            text-align: center;
            color: var(--accent);
            padding: 40px;
            font-family: 'Sono', monospace;
        }

        @media (min-width: 600px) {
            .explorador-grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                max-width: 1200px;
                gap: 20px;
            }
        }

        @media only screen and (max-width: 767px) {
            .icono-flotante {
                font-size: 12px;
            }

            .indicador-estado {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <main style="max-width: 1200px; margin: 0 auto;">
        <a href="index.html" class="btn-volver">← Volver a Artistas</a>
        <header>
            <h1 id="artista-titulo">Artista</h1>
            <p>Selecciona una canción.</p>
        </header>

        <div id="explorador" class="explorador-grid">
            <div class="cargando">Buscando carátulas de los álbumes...</div>
        </div>
    </main>

    <script type="module">
        import { obtenerCanciones, obtenerPortadaAlbumCancion } from './js/api-cliente.js';

        const params = new URLSearchParams(window.location.search);
        const idA = params.get('idA');
        const nombreA = params.get('nombre') || 'Artista';

        const artistaTitulo = document.getElementById('artista-titulo');
        const exploradorDiv = document.getElementById('explorador');

        artistaTitulo.textContent = nombreA;

        async function init() {
            if(!idA) {
                exploradorDiv.innerHTML = "<div>Error: No se especificó un artista válido.</div>";
                return;
            }

            try {
                const canciones = await obtenerCanciones(idA);
                exploradorDiv.innerHTML = "";
                
                if(canciones.length === 0) {
                    exploradorDiv.innerHTML = "<div>Este artista no tiene canciones registradas aún.</div>";
                    return;
                }

                for (const cancion of canciones) {
                    const tarjeta = document.createElement('div');
                    tarjeta.className = "tarjeta";
                    
                    tarjeta.onclick = () => {
                        if (nombreA.toLowerCase() === 'notas') {
                            // Redirigir al editor pasando el ID de la canción
                            window.location.href = `notas.html?idC=${cancion.idC}`;
                        } else {
                            // Comportamiento normal para canciones
                            window.location.href = `visor.html?idC=${cancion.idC}&idA=${idA}&nombreA=${encodeURIComponent(nombreA)}`;
                        }
                    };

                    const artistaContexto = cancion.nombreA || nombreA;
                    let portadaUrl = 'https://www.shutterstock.com/image-photo/highquality-png-analog-record-disc-600nw-2561107141.jpg';

                    if (nombreA.toLowerCase() !== 'notas') {
                        const artistaContexto = cancion.nombreA || nombreA;
                        portadaUrl = await obtenerPortadaAlbumCancion(artistaContexto, cancion.albumC, cancion.albumBusqueda);
                    }

                    tarjeta.style.backgroundImage = `url('${portadaUrl}')`;
                    
                    const esTerminada = (cancion.terminada == true || cancion.terminada == 1);
                    const iconoEstado = esTerminada ? "🟢" : "🔴";
                    
                    tarjeta.innerHTML = `
                        <div class="icono-flotante">${cancion.nombreC}</div>
                        <div class="indicador-estado">${iconoEstado}</div>
                    `;
                    exploradorDiv.appendChild(tarjeta);
                }
            } catch(e) {
                exploradorDiv.innerHTML = "<div class='cargando'>Error al cargar las canciones.</div>";
            }
        }

        init();
    </script>
</body>
</html>
