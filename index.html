<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="icono.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sono:MONO@0..1&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <title>Acordes & Letras - Artistas</title>
    <style>
        header {
            max-width: 1200px;
            margin: 0 auto 30px auto;
        }
        
        h1 {
            margin: 0;
            font-size: 24px;
            color: #fff;
        }
        
        p {
            margin: 5px 0 0 0;
            font-size: 13px;
            color: #888;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .explorador-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin: 0 auto;
        }

        .tarjeta {
            background-color: #1e1e24;
            border-radius: 12px;
            aspect-ratio: 1 / 1;
            position: relative;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .tarjeta:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .icono-flotante {
            position: absolute;
            bottom: 12px;
            left: 12px;
            font-size: 16px;
            z-index: 2;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 4px 10px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            font-weight: bold;
            margin-right: 12px;
        }

        .cargando {
            text-align: center;
            color: var(--accent);
            padding: 40px;
            font-family: 'Sono', monospace;
        }

        @media (min-width: 600px) {
            .explorador-grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                max-width: 1200px;
                gap: 20px;
            }
        }

        @media only screen and (max-width: 767px) {
            .icono-flotante {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Artistas</h1>
        <p>Selecciona un artista para ver sus canciones.</p>
    </header>

    <main id="explorador" class="explorador-grid">
        <div class="cargando">Buscando portadas en iTunes...</div>
    </main>

    <script type="module">
        import { obtenerArtistas, obtenerPortadaArtista } from './js/api-cliente.js';

        const exploradorDiv = document.getElementById('explorador');

        async function init() {
            try {
                const artistas = await obtenerArtistas();
                exploradorDiv.innerHTML = "";
                
                for (const artista of artistas) {
                    const tarjeta = document.createElement('div');
                    tarjeta.className = "tarjeta";
                    
                    tarjeta.onclick = () => {
                        window.location.href = `canciones.html?idA=${artista.idA}&nombre=${encodeURIComponent(artista.nombreA)}`;
                    };
                    
                    const portadaUrl = await obtenerPortadaArtista(artista.nombreA);
                    tarjeta.style.backgroundImage = `url('${portadaUrl}')`;
                    tarjeta.innerHTML = `<div class="icono-flotante">${artista.nombreA}</div>`;
                    exploradorDiv.appendChild(tarjeta);
                }
            } catch (err) {
                exploradorDiv.innerHTML = "<div class='cargando'>Error al conectar con la base de datos.</div>";
            }
        }

        init();
    </script>
</body>
</html>
