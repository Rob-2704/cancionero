<!DOCTYPE html>
<html lang="es-mx">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d0d0d">

    <link rel="icon" type="image/x-icon" href="img/icono.png">
    <link rel="manifest" href="manifest.json">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sono:MONO@0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&display=swap">

    <link href="style.css" rel="stylesheet">
    <title>Acordes &amp; Letras - Artistas</title>
    <style>
        .pie {
            margin-top: 40px;
            text-align: center;
            font-size: 12px;
        }

        .pie a {
            color: var(--text-sec);
            text-decoration: none;
            transition: color 0.2s;
        }

        .pie a:hover { color: var(--accent); }
    </style>
</head>
<body>
    <header>
        <div class="contenedor-titulo-indicador">
            <h1>Artistas</h1>
            <span id="indicador-guardado" class="indicador-guardado" title="Sincronizando canciones...">
                <span class="material-symbols-outlined icono-estado-guardado">sync</span>
            </span>
        </div>
        <p>Selecciona un artista para ver sus canciones.</p>
    </header>

    <main>
        <div id="explorador" class="explorador-grid">
            <div class="cargando">Cargando artistas...</div>
        </div>

        <div class="pie"><a href="subir-canciones.html">Administrar canciones</a></div>
    </main>

    <script type="module">
        import {
            obtenerArtistas, obtenerPortadaArtista,
            alCambiarEstadoGuardado, alActualizarDatos, CONFIGURADO
        } from './js/api-cliente.js';
        import {
            activarAnimacionIconos, conectarIndicador,
            animarEntrada, contarColumnas, aplicarPortada
        } from './js/ui.js';

        const exploradorDiv = document.getElementById('explorador');
        let firma = '';

        conectarIndicador(alCambiarEstadoGuardado);
        activarAnimacionIconos();

        function mostrarMensaje(texto, error = false) {
            exploradorDiv.innerHTML = '';
            const div = document.createElement('div');
            div.className = 'cargando' + (error ? ' error' : '');
            div.textContent = texto;
            exploradorDiv.appendChild(div);
        }

        // animar = true en la primera carga; en actualizaciones en segundo plano no se repite la animación
        async function render(animar) {
            if (!CONFIGURADO) {
                mostrarMensaje('Falta configurar Firebase: edita js/firebase-config.js con los datos de tu proyecto.', true);
                return;
            }

            try {
                const artistas = await obtenerArtistas();
                const nuevaFirma = JSON.stringify(artistas);
                if (!animar && nuevaFirma === firma) return;
                firma = nuevaFirma;

                if (artistas.length === 0) {
                    mostrarMensaje(navigator.onLine
                        ? 'Aún no hay canciones. Súbelas desde "Administrar canciones".'
                        : 'Sin conexión y sin copia local todavía.');
                    return;
                }

                exploradorDiv.innerHTML = '';
                const columnas = contarColumnas(exploradorDiv);

                artistas.forEach((artista, indice) => {
                    const tarjeta = document.createElement('a');
                    tarjeta.className = 'tarjeta';
                    tarjeta.href = `canciones.html?idA=${encodeURIComponent(artista.idA)}&nombre=${encodeURIComponent(artista.nombreA)}`;
                    tarjeta.title = `${artista.nombreA} · ${artista.total} ${artista.total === 1 ? 'canción' : 'canciones'}`;

                    const portada = document.createElement('div');
                    portada.className = 'tarjeta-portada';

                    const nombre = document.createElement('div');
                    nombre.className = 'icono-flotante';
                    nombre.textContent = artista.nombreA;

                    tarjeta.append(portada, nombre);

                    if (animar) animarEntrada(tarjeta, indice, columnas);
                    else tarjeta.classList.add('sin-animacion');

                    exploradorDiv.appendChild(tarjeta);

                    // Las portadas llegan en segundo plano: las tarjetas aparecen al instante
                    obtenerPortadaArtista(artista.nombreA, artista.idA).then(url => aplicarPortada(tarjeta, url));
                });
            } catch (err) {
                console.error(err);
                if (err && err.message === 'FIREBASE_NO_CONFIGURADO') {
                    mostrarMensaje('Falta configurar Firebase: edita js/firebase-config.js con los datos de tu proyecto.', true);
                } else {
                    mostrarMensaje('Error al conectar con la base de datos.', true);
                }
            }
        }

        render(true);
        alActualizarDatos(() => render(false));
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('Service Worker no registrado:', err));
            });
        }
    </script>
</body>
</html>
