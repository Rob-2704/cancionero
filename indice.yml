name: Generar indice.json

on:
  push:
    paths:
      - 'Canciones/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  indice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node generar-indice.js
      - name: Commit del índice
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add indice.json
          git diff --staged --quiet || (git commit -m "Actualizar indice.json" && git push)
